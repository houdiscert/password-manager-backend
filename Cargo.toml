[package]
name = "password-manager-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
bytes = "1.11.1"
dotenvy = "0.15.7"
hmac = "0.13.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
snowflaked = { version = "1.0.3", features = ["sync"] }
sqlx = { version = "0.9.0", features = ["mysql", "mysql-rsa", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["full", "sync"] }
warp = { version = "0.4.3", features = ["server"] }
